version: '3.9'

services:
  mongodb:
    image: mongo:latest
    container_name: btc-contrakt-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - btc-network

  app:
    build: .
    container_name: btc-contrakt-app
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://root:password123@mongodb:27017/btc-contrakt?authSource=admin
      JWT_SECRET: your_secure_jwt_secret_key_change_this
      JWT_EXPIRE: 7d
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - btc-network
    restart: unless-stopped

networks:
  btc-network:
    driver: bridge

volumes:
  mongo_data:
